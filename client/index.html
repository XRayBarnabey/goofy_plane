<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goofy Plane</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:sans-serif;color:#fff}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#menu input,#menu button{font-size:18px;padding:8px 14px}
#hud{position:fixed;top:10px;left:10px;text-shadow:0 0 3px #000;white-space:pre;font-family:monospace}
#board{position:fixed;top:10px;right:10px;text-shadow:0 0 3px #000;white-space:pre;font-family:monospace;text-align:right}
#feed{position:fixed;bottom:50px;left:10px;text-shadow:0 0 3px #000;font-size:14px;max-width:50%}
#chat{position:fixed;bottom:10px;left:10px;display:none}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fff;border-radius:50%;opacity:.6}
</style></head><body>
<div id="menu"><h1>✈ Goofy Plane</h1><input id="name" maxlength="16" placeholder="Pseudo">
<button id="play">Jouer</button>
<div style="text-align:center;line-height:1.5">Z/S ou ↑/↓ : tangage (Z = piquer) · Q/D ou ←/→ : roulis · A/E : lacet<br>Shift : gaz + · Ctrl : gaz − · Espace : tirer · Entrée : chat</div></div>
<div id="hud"></div><div id="board"></div><div id="feed"></div><div id="cross"></div>
<input id="chat" maxlength="120" placeholder="Message…">
<script type="module" src="/src/main.ts"></script></body></html>
