<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goofy Plane</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:sans-serif;color:#fff}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#menu input,#menu button{font-size:18px;padding:8px 14px}
#hud{position:fixed;top:10px;left:10px;text-shadow:0 0 3px #000;white-space:pre;font-family:monospace}
#health{position:fixed;top:10px;left:10px;margin-top:104px;width:190px;height:14px;border:1px solid #fff;background:rgba(0,0,0,.55)}
#health-fill{height:100%;width:100%;background:#42d66b;transition:width .15s,background .15s}
#board{position:fixed;top:10px;right:10px;text-shadow:0 0 3px #000;white-space:pre;font-family:monospace;text-align:right}
#room-display{position:fixed;top:10px;left:220px;text-shadow:0 0 3px #000;font-family:monospace}
#feed{position:fixed;bottom:50px;left:10px;text-shadow:0 0 3px #000;font-size:14px;max-width:50%}
#chat{position:fixed;bottom:10px;left:10px;display:none}
#cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border:2px solid #fff;border-radius:50%;opacity:.6}
#menu{max-height:100vh;overflow:auto;box-sizing:border-box;padding:24px}
#menu input,#menu button,#menu select{font-size:16px;padding:8px 12px}
#room-controls{display:flex;gap:8px;align-items:center}
#keybinds{display:grid;grid-template-columns:auto auto;gap:5px 12px;text-align:left;font-size:14px}
#keybinds button{font-size:13px;padding:4px 8px}
</style></head><body>
<div id="menu"><h1>✈ Goofy Plane</h1><input id="name" maxlength="16" placeholder="Pseudo">
<label>Avion <select id="aircraft"><option value="0">Éclaireur</option><option value="1">Intercepteur</option><option value="2">Bombardier</option></select></label>
<div id="room-controls"><button id="play">Créer une partie</button><input id="room-code" inputmode="numeric" maxlength="3" placeholder="Code à 3 chiffres"><button id="join-room">Rejoindre</button></div>
<div id="room-status"></div>
<div style="text-align:center;line-height:1.5">1 : mitrailleuse · 2 : roquettes · Espace : tirer · Entrée : chat</div>
<h3>Touches — cliquer pour modifier</h3><div id="keybinds"></div></div>
<div id="hud"></div><div id="health"><div id="health-fill"></div></div><div id="room-display"></div><div id="board"></div><div id="feed"></div><div id="cross"></div>
<input id="chat" maxlength="120" placeholder="Message…">
<script type="module" src="/src/main.ts"></script></body></html>
